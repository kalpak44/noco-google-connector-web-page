version: 2
updates:
  # --- GitHub Actions -----------------------------------------------------
  # Workflow actions are pinned to commit SHAs so the build cannot be changed
  # under us by a retagged release (CWE-829). A pin with no update mechanism
  # rots into an unpatched dependency, which is the failure mode this entry
  # exists to prevent: Dependabot rewrites the SHA and updates the trailing
  # version comment, so pinning stays cheap to maintain.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # --- Docker -------------------------------------------------------------
  # site/Dockerfile builds the nginx image serving the public privacy policy
  # and terms of service. Those pages are a Google OAuth verification
  # requirement, so the container serving them stays maintained.
  - package-ecosystem: docker
    directory: "/site"
    schedule:
      interval: weekly
